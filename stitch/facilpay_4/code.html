<main class="pt-24 pb-12 px-margin-mobile md:px-margin-desktop max-w-[800px] mx-auto">
<!-- Welcome Header -->
<div class="mb-10 text-right">
<h1 class="font-headline-lg text-headline-lg text-on-surface mb-2">הוספת רעיון חדש</h1>
<p class="font-body-md text-body-md text-secondary">יש לך רעיון מבריק? שתף אותו עם הצוות כדי שנוכל להפוך אותו למציאות.</p>
</div>
<!-- Idea Form Card -->
<div class="bg-surface-container-lowest border border-border-light rounded-xl shadow-[0px_4px_20px_rgba(0,0,0,0.05)] p-8">
<form class="space-y-8" id="addIdeaForm">
<!-- Title Field -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-secondary" for="title">כותרת הרעיון</label>
<input class="w-full bg-surface-subtle border border-border-light rounded-lg px-4 py-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary text-body-md transition-all placeholder:text-outline-variant" id="title" name="title" placeholder="למשל: ייעול תהליך החיוב החודשי" required="" type="text"/>
</div>
<!-- Category Selection (Bento-style Grid) -->
<div class="space-y-3">
<label class="block font-label-md text-label-md text-secondary">קטגוריה</label>
<div class="grid grid-cols-2 gap-4">
<label class="relative cursor-pointer group">
<input checked="" class="peer sr-only" name="category" type="radio" value="development"/>
<div class="flex flex-col items-center justify-center p-6 bg-surface-subtle border-2 border-transparent rounded-xl peer-checked:border-primary peer-checked:bg-primary/5 hover:bg-surface-container-low transition-all duration-200">
<span class="material-symbols-outlined text-primary mb-2 text-[32px]">code</span>
<span class="font-label-md text-label-md text-on-surface">פיתוח</span>
</div>
</label>
<label class="relative cursor-pointer group">
<input class="peer sr-only" name="category" type="radio" value="monitoring"/>
<div class="flex flex-col items-center justify-center p-6 bg-surface-subtle border-2 border-transparent rounded-xl peer-checked:border-primary peer-checked:bg-primary/5 hover:bg-surface-container-low transition-all duration-200">
<span class="material-symbols-outlined text-primary mb-2 text-[32px]">monitoring</span>
<span class="font-label-md text-label-md text-on-surface">בקרה</span>
</div>
</label>
</div>
</div>
<!-- Description Field -->
<div class="space-y-2">
<label class="block font-label-md text-label-md text-secondary" for="description">תיאור הרעיון</label>
<textarea class="w-full bg-surface-subtle border border-border-light rounded-lg px-4 py-3 focus:outline-none focus:border-primary focus:ring-1 focus:ring-primary text-body-md transition-all placeholder:text-outline-variant resize-none" id="description" name="description" placeholder="פרט כאן את המהות של הרעיון, את הבעיה שהוא פותר ואיך הוא ייושם..." required="" rows="5"></textarea>
</div>
<!-- Priority Levels (Chips style) -->
<div class="space-y-3">
<label class="block font-label-md text-label-md text-secondary">רמת חשיבות</label>
<div class="flex flex-wrap gap-3">
<label class="cursor-pointer">
<input class="peer sr-only" name="priority" type="radio" value="low"/>
<div class="px-6 py-2 rounded-full border border-border-light bg-surface-subtle text-secondary peer-checked:bg-blue-50 peer-checked:text-blue-700 peer-checked:border-blue-200 font-label-md text-label-md transition-all hover:bg-surface-container-low">נמוכה</div>
</label>
<label class="cursor-pointer">

<div class="px-6 py-2 rounded-full border border-border-light bg-surface-subtle text-secondary peer-checked:bg-amber-50 peer-checked:text-amber-700 peer-checked:border-amber-200 font-label-md text-label-md transition-all hover:bg-surface-container-low">בינונית</div>

<input class="peer sr-only" name="priority" type="radio" value="high"/>
<div class="px-6 py-2 rounded-full border border-border-light bg-surface-subtle text-secondary peer-checked:bg-rose-50 peer-checked:text-rose-700 peer-checked:border-rose-200 font-label-md text-label-md transition-all hover:bg-surface-container-low">גבוהה</div>
</label>

<span class="material-symbols-outlined" data-weight="fill">add_circle</span>

<span class="font-label-sm text-label-sm">Ideas</span>

<span class="font-label-sm text-label-sm">Add</span>

<div class="fixed top-20 right-[5%] w-64 h-64 bg-primary/5 rounded-full blur-[100px] pointer-events-none -z-10"></div>
<div class="fixed bottom-20 left-[5%] w-96 h-96 bg-surface-container-high/40 rounded-full blur-[100px] pointer-events-none -z-10"></div>
<script>
        // Simple form submission feedback
        document.getElementById('addIdeaForm').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            btn.disabled = true;
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin">sync</span> שולח רעיון...`;
            btn.classList.add('opacity-80');
            
            setTimeout(() => {
                btn.innerHTML = `<span class="material-symbols-outlined">check_circle</span> הרעיון נוסף בהצלחה!`;
                btn.classList.remove('bg-primary');
                btn.classList.add('bg-success-vibrant');
                
                setTimeout(() => {
                    e.target.reset();
                    btn.innerHTML = originalContent;
                    btn.classList.add('bg-primary');
                    btn.classList.remove('bg-success-vibrant', 'opacity-80');
                    btn.disabled = false;
                }, 2000);
            }, 1500);
        });
    </script>
