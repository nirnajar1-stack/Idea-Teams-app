<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f5f6fa" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <title>Ogen System — עוגן</title>
    <script>
      ;(function () {
        var k = 'ideaflow-theme-v1'
        var s = localStorage.getItem(k)
        var theme = s === 'light' || s === 'dim' || s === 'dark' ? s : 'light'
        var root = document.documentElement
        root.classList.remove('dark', 'dim')
        if (theme === 'dark') root.classList.add('dark')
        if (theme === 'dim') root.classList.add('dim')
        root.dataset.theme = theme
        root.style.colorScheme = theme === 'dark' ? 'dark' : 'light'
        var colors = { light: '#f5f6fa', dim: '#f4f0eb', dark: '#121214' }
        var meta = document.querySelector('meta[name="theme-color"]')
        if (meta) meta.setAttribute('content', colors[theme])
      })()
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
